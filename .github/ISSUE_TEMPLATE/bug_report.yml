name: Fehler melden
description: Etwas funktioniert nicht wie beschrieben
labels: [bug]
body:
  - type: input
    id: blueprint
    attributes:
      label: Betroffenes Blueprint
      placeholder: Gerät bei Leistungsunterschreitung ausschalten
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home-Assistant-Version
      placeholder: "2026.9.0"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: Was passiert?
      description: Was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Konfiguration der Automation
      description: YAML der Automation (Automation öffnen, Dreipunktmenü → "In YAML bearbeiten").
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Relevante Logeinträge
      render: shell
